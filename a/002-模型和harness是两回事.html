<div class="head"><div class="kicker">讲清</div><h1>模型和 harness 是两回事</h1><div class="meta">讲清 · 第 1 篇 · 2026-11-15</div></div><article><p>新手最容易混的，是把模型和工具当成一回事。</p>
<p>模型是大脑，比如 DeepSeek、通义千问。它负责思考。</p>
<p>harness 是套在大脑外面的工作环境，比如 Claude Code。它给模型配上读文件、跑命令的手脚。</p>
<p>关键的一句：这两样可以分开配。Claude Code 这个外壳，里面可以装 DeepSeek 的大脑。</p>
<p>想明白这个，你就懂了为什么能&quot;不翻墙用国产模型&quot;——外壳不变，换个大脑而已。</p></article>
